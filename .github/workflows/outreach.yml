name: Daily B2B Cold Outreach

on:
  schedule:
    # Runs at 09:00 AM UTC every Monday through Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Lead Scraper & Zoho Dispatcher
        env:
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python outreach_engine.py